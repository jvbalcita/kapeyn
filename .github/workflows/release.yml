# On every push to main and every pull request: run the tests, build both apps, and check that all three
# install paths (Windows one-liner, Mac one-liner, Homebrew) work against the latest published release.
# On a version tag (v2.3.0, ...): also publish a GitHub Release with the downloads, installers and checksums,
# then point the Homebrew formula at the new version.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: powershell
        run: .\test.ps1
      - name: Build Kapeyn.exe and kapeyn.com
        shell: powershell
        run: .\build.ps1
      - name: Check the command-line tool
        shell: powershell
        run: |
          .\dist\kapeyn.com help
          if ($LASTEXITCODE -ne 0) { throw "kapeyn help failed" }
      - name: Run kapeyn through a symbolic link (how winget installs it)
        shell: powershell
        run: |
          $links = Join-Path $env:RUNNER_TEMP 'Links'
          New-Item -ItemType Directory $links | Out-Null
          New-Item -ItemType SymbolicLink -Path "$links\kapeyn.exe" -Target "$PWD\dist\kapeyn-cli.exe" | Out-Null
          Get-Process Kapeyn -ErrorAction SilentlyContinue | Stop-Process -Force
          & "$links\kapeyn.exe" status     # the app isn't running, so the command has to find and start it
          if ($LASTEXITCODE -ne 0) { throw "kapeyn via a link couldn't start the app" }
          $app = (Get-Process Kapeyn).Path
          "app started from: $app"
          if ($app -ne "$PWD\dist\Kapeyn.exe") { throw "started the wrong Kapeyn.exe" }
          Stop-Process -Name Kapeyn -Force
      - name: Zip (app + command + installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist\Kapeyn.exe, dist\kapeyn.com, dist\kapeyn-cli.exe, install.ps1, README.md, LICENSE pkg\
          Compress-Archive -Path pkg\* -DestinationPath Kapeyn-Windows.zip
          Copy-Item dist\Kapeyn.exe .   # keep both files at the artifact's top level
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Kapeyn.exe
            Kapeyn-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash mac/tests/run.sh
      - name: Build Kapeyn.app (universal)
        run: bash mac/build.sh
      - name: Check the app bundle
        run: |
          lipo -info mac/dist/Kapeyn.app/Contents/MacOS/Kapeyn
          codesign --verify --verbose mac/dist/Kapeyn.app
          plutil -lint mac/dist/Kapeyn.app/Contents/Info.plist
          test -s mac/dist/Kapeyn.app/Contents/Resources/help.md && echo "help guide bundled"
      - name: Smoke test (launch the app and drive it with the kapeyn command)
        continue-on-error: true
        run: |
          K=mac/dist/Kapeyn.app/Contents/MacOS/Kapeyn
          "$K" help
          "$K" on 1h
          "$K" status
          pmset -g assertions | grep -i kapeyn
          "$K" run sleep 3 && echo "kapeyn run: ok"
          "$K" doctor
          "$K" off
          "$K" status
      - name: Zip
        run: ditto -c -k --keepParent mac/dist/Kapeyn.app Kapeyn-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Kapeyn-macOS.zip

  # ---- install paths (against the latest published release) ------------------------------------

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: One-line install (download the installer to TEMP, then run it)
        shell: powershell
        run: |
          # Same as the published one-liner, using this branch's install.ps1: with no app files next to it,
          # it downloads the latest release and checks its SHA-256.
          Copy-Item "$env:GITHUB_WORKSPACE\install.ps1" "$env:TEMP\kapeyn-install.ps1"
          powershell -ExecutionPolicy Bypass -File "$env:TEMP\kapeyn-install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }
      - name: Check the installation
        shell: powershell
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Kapeyn"
          foreach ($f in 'Kapeyn.exe', 'kapeyn.com') { if (-not (Test-Path "$dir\$f")) { throw "$f missing" } }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir) { throw "install folder not on PATH" }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Kapeyn) { throw "no start-at-sign-in entry" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $userPath
          Start-Sleep 3
          kapeyn status
          if ($LASTEXITCODE -ne 0) { throw "kapeyn status failed" }
      - name: One-line uninstall
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File "$env:TEMP\kapeyn-install.ps1" -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\Kapeyn") { throw "install folder still there" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -like '*Programs\Kapeyn*') { throw "still on PATH" }
          "uninstalled cleanly"

  install-mac:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - name: One-line install (curl ... | bash)
        run: cat mac/get.sh | bash
      - name: Check the installation
        run: |
          APP="$HOME/Applications/Kapeyn.app"
          test -x "$APP/Contents/MacOS/Kapeyn"
          test -f "$HOME/Library/LaunchAgents/com.kapeyn.Kapeyn.login.plist"
          sleep 3
          "$APP/Contents/MacOS/Kapeyn" status
          bash mac/install.sh --uninstall
          test ! -e "$APP" && echo "uninstalled cleanly"
      - name: Homebrew install
        run: |
          brew tap-new --no-git local/kapeyn
          cp Formula/kapeyn.rb "$(brew --repository)/Library/Taps/local/homebrew-kapeyn/Formula/"
          brew install --build-from-source local/kapeyn/kapeyn
          kapeyn help
          brew test local/kapeyn/kapeyn
          brew uninstall kapeyn

  # ---- release (tags only) -----------------------------------------------------------------------

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Installers and checksums
        run: |
          cp install.ps1 assets/install.ps1
          sed "s/__VERSION__/${GITHUB_REF_NAME}/" mac/get.sh > assets/install-mac.sh
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o source.tar.gz
          (cd assets && cp ../source.tar.gz . && sha256sum Kapeyn.exe Kapeyn-Windows.zip Kapeyn-macOS.zip install.ps1 install-mac.sh source.tar.gz > SHA256SUMS.txt && rm source.tar.gz)
          cat assets/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/Kapeyn.exe
            assets/Kapeyn-Windows.zip
            assets/Kapeyn-macOS.zip
            assets/install.ps1
            assets/install-mac.sh
            assets/SHA256SUMS.txt
          body: |
            Kapeyn keeps your computer awake, intelligently. Click the coffee cup to turn it on or off; right-click it for options and Help.

            ## Install (recommended)

            **Windows 10/11.** Paste into PowerShell. It installs the app and the `kapeyn` command, and starts at sign-in. No admin needed, no SmartScreen warning.
            ```powershell
            irm https://github.com/jvbalcita/kapeyn/releases/latest/download/install.ps1 -OutFile $env:TEMP\kapeyn-install.ps1; powershell -ExecutionPolicy Bypass -File $env:TEMP\kapeyn-install.ps1
            ```

            **macOS 12+.** Paste into Terminal. It builds Kapeyn on your Mac, so there's no "unverified developer" warning.
            ```bash
            curl -fsSL https://github.com/jvbalcita/kapeyn/releases/latest/download/install-mac.sh | bash
            ```

            **Homebrew:**
            ```bash
            brew tap jvbalcita/kapeyn https://github.com/jvbalcita/kapeyn && brew install kapeyn
            ```

            Both installers check every download against `SHA256SUMS.txt`.

            ## Manual downloads

            - `Kapeyn.exe`: Windows app; double-click to run. Unsigned, so SmartScreen may ask you to click **More info → Run anyway**.
            - `Kapeyn-Windows.zip`: app, `kapeyn` command and `install.ps1`.
            - `Kapeyn-macOS.zip`: `Kapeyn.app` (Apple silicon & Intel). Not notarized, so allow it under **System Settings → Privacy & Security → Open Anyway**.

  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the Homebrew formula at this release
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          sed -i -E "s#^  url \".*\"#  url \"${URL}\"#; s#^  sha256 \".*\"#  sha256 \"${SHA}\"#" Formula/kapeyn.rb
          grep -E '^  (url|sha256) ' Formula/kapeyn.rb
          if git diff --quiet; then echo "Formula already points at ${GITHUB_REF_NAME}."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew: kapeyn ${GITHUB_REF_NAME}"
          git push origin HEAD:main
