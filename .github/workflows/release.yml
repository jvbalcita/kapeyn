# Builds Kapeyn for Windows and macOS on every push to main (as a check),
# and publishes a GitHub Release with both downloads when a version tag (v1.0.0, ...) is pushed.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Kapeyn.exe
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Kapeyn.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Kapeyn.app (universal)
        run: bash mac/build.sh
      - name: Check the app bundle
        run: |
          lipo -info mac/dist/Kapeyn.app/Contents/MacOS/Kapeyn
          codesign --verify --verbose mac/dist/Kapeyn.app
          plutil -lint mac/dist/Kapeyn.app/Contents/Info.plist
      - name: Zip
        run: ditto -c -k --keepParent mac/dist/Kapeyn.app Kapeyn-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Kapeyn-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/Kapeyn.exe
            assets/Kapeyn-macOS.zip
          body: |
            Kapeyn keeps your computer awake. Click the coffee cup to turn it on or off; right-click it for options.

            ## Download

            **Windows 10/11:** `Kapeyn.exe`. Double-click it to run; no install is needed.
            The app isn't code-signed yet, so the first time SmartScreen may say *"Windows protected your PC"*. Click **More info → Run anyway**.
            To have it start when you sign in, right-click the cup and choose **Start with Windows**.

            **macOS 12+ (Apple silicon & Intel):** `Kapeyn-macOS.zip`. Unzip it and drag **Kapeyn** to Applications.
            The app isn't notarized by Apple yet, so the first launch is blocked. Open **System Settings → Privacy & Security** and click **Open Anyway**.
            Alternatively, run `xattr -dr com.apple.quarantine /Applications/Kapeyn.app` in Terminal.
            You can avoid this step entirely by building it yourself: `bash mac/install.sh` (see the README).
